name: Verify and build Windows desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m compileall -q src run_desktop.py
      - run: python -m unittest discover -s tests -v

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pyinstaller "pillow>=11.2.1"
      - run: python scripts/capture_ui.py ui-preview
      - run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name AutomatedGerberCompare --paths src src/automated_gerber_compare/__main__.py
      - name: Validate packaged application
        shell: pwsh
        run: |
          $application = Start-Process -FilePath dist/AutomatedGerberCompare/AutomatedGerberCompare.exe -PassThru
          Start-Sleep -Seconds 5
          $application.Refresh()
          if ($application.HasExited) { throw 'Packaged GUI exited during startup.' }
          if ($application.MainWindowTitle -notlike 'Automated Gerber Compare*') {
            Stop-Process -Id $application.Id
            throw 'Packaged application did not show its main desktop window.'
          }
          Stop-Process -Id $application.Id
      - uses: actions/upload-artifact@v4
        with:
          name: AutomatedGerberCompare-Windows
          path: dist/AutomatedGerberCompare/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Desktop-UI-Preview
          path: ui-preview/
          if-no-files-found: error
